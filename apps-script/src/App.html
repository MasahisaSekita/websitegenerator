<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Helpers

  const $ = (selector, root) => (root || document).querySelector(selector);
  const $$ = (selector, root) => Array.from((root || document).querySelectorAll(selector));
  const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = value => String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, character => ESCAPES[character]);
  const icon = (name, extra) => `<svg class="icon${extra ? ' ' + extra : ''}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const plural = (count, word, many) => `${count} ${count === 1 ? word : many || word + 's'}`;
  const sum = (list, pick) => list.reduce((total, item) => total + (Number(pick(item)) || 0), 0);
  const storage = {
    get(key) { try { return window.localStorage.getItem(key); } catch (error) { return null; } },
    set(key, value) { try { if (value === null) window.localStorage.removeItem(key); else window.localStorage.setItem(key, value); } catch (error) { /* private mode */ } },
  };

  function safeUrl(value) {
    if (typeof value !== 'string' || !value) return null;
    try {
      const url = new URL(value);
      return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
    } catch (error) {
      return null;
    }
  }
  function hostOf(value) {
    const url = safeUrl(value);
    return url ? new URL(url).hostname.replace(/^www\./, '') : '';
  }
  function shortUrl(value) {
    const url = safeUrl(value);
    if (!url) return String(value || '');
    const parsed = new URL(url);
    return parsed.hostname.replace(/^www\./, '') + (parsed.pathname === '/' ? '' : parsed.pathname);
  }

  let clockSkew = 0;
  const now = () => Date.now() + clockSkew;
  function ago(iso) {
    const time = Date.parse(iso);
    if (!Number.isFinite(time)) return '—';
    const seconds = Math.max(0, Math.round((now() - time) / 1000));
    if (seconds < 45) return 'just now';
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    if (days < 7) return `${days}d ago`;
    return new Date(time).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function stamp(iso) {
    const time = Date.parse(iso);
    return Number.isFinite(time) ? new Date(time).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Unknown time';
  }
  function shortDate(iso) {
    const time = Date.parse(iso);
    return Number.isFinite(time) ? new Date(time).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
  }

  function server(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('This page has to be opened from its Apps Script web app URL.'));
        return;
      }
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });
  }
  const isAccessError = error => /ACCESS_DENIED/.test(String(error && error.message || error));
  const errorText = error => String(error && error.message || error || 'Something went wrong').replace(/^(Exception|Error|LedgerError):\s*/, '').replace(/^ACCESS_DENIED:\s*/, '');

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text) {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    (document.querySelector('dialog[open]') || document.body).appendChild(area);
    area.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (error) { copied = false; }
    area.remove();
    return copied;
  }

  // ---------------------------------------------------------------------------
  // Pipeline model

  const STAGE_LABELS = {
    queued: 'Queued', reviewing: 'Reviewing', extracting: 'Collecting details', building: 'Building', checking: 'Checking',
    deploying: 'Deploying', ready: 'Preview live', contacting: 'Contacting', complete: 'Sent', sent: 'Sent',
    uncertain: 'Uncertain', blocked: 'Blocked', skipped: 'Skipped', manual: 'Manual outreach', delivered: 'Delivered',
  };
  const STEPS = [
    { label: 'Queued', stages: ['queued'] },
    { label: 'Qualify', stages: ['reviewing', 'extracting'] },
    { label: 'Build', stages: ['building'] },
    { label: 'QA', stages: ['checking'] },
    { label: 'Deploy', stages: ['deploying'] },
    { label: 'Live', stages: ['ready'] },
    { label: 'Outreach', stages: ['contacting', 'complete', 'sent', 'manual'] },
  ];
  // With delivery "file" a website is finished once QA passes and the file is handed over.
  const FILE_STEPS = STEPS.slice(0, 4).concat([{ label: 'Delivered', stages: ['delivered'] }]);
  const GENERATOR_COMMAND = 'python tools/site_runner.py watch';
  const CATEGORIES = [
    { key: 'all', label: 'All' },
    { key: 'target', label: 'Targets' },
    { key: 'working', label: 'In progress' },
    { key: 'live', label: 'Preview live' },
    { key: 'manual', label: 'Manual' },
    { key: 'sent', label: 'Sent' },
    { key: 'delivered', label: 'Delivered' },
    { key: 'attention', label: 'Needs attention' },
    { key: 'skipped', label: 'Skipped' },
  ];
  const CATEGORY_ORDER = ['working', 'target', 'live', 'manual', 'attention', 'sent', 'delivered', 'skipped'];
  const BATCH_TONES = { queued: 'neutral', running: 'working', complete: 'sent', exhausted: 'manual', blocked: 'attention', cancelled: 'skipped' };
  const CONTACT_LABELS = {
    not_sent: 'Not sent yet', attempting: 'Submission in progress', submitted: 'Submitted through the contact form', sent: 'Sent',
    uncertain: 'Uncertain — never retried', blocked: 'Blocked before submitting', manual_required: 'Manual outreach needed',
  };
  const label = value => String(value || '').replace(/[_-]+/g, ' ').replace(/^./, character => character.toUpperCase());

  const dataOf = job => (job && job.data && typeof job.data === 'object' ? job.data : {});
  const requestedAt = job => dataOf(job).generate_requested_at || '';
  const isTarget = job => job.stage === 'queued' && !job.worker;
  const jetaiOf = job => (dataOf(job).jetai && typeof dataOf(job).jetai === 'object' ? dataOf(job).jetai : {});
  const batchMode = batch => (batch && batch.mode === 'targets' ? 'targets' : 'build');
  const isHandPicked = batch => Boolean(batch && batch.industry === 'Hand-picked websites');
  const isManual = job => job.stage === 'manual' || job.contact_status === 'manual_required';
  const manualInfo = job => (dataOf(job).manual_outreach && typeof dataOf(job).manual_outreach === 'object' ? dataOf(job).manual_outreach : {});
  const manualSent = job => Boolean(manualInfo(job).sent_at);
  function category(job) {
    if (isManual(job)) return 'manual';
    if (job.stage === 'queued') return 'target';
    if (['blocked', 'uncertain', 'failed', 'error', 'needs_attention'].includes(job.stage)) return 'attention';
    if (['skipped', 'rejected'].includes(job.stage)) return 'skipped';
    if (job.stage === 'delivered') return 'delivered';
    if (['complete', 'sent', 'completed', 'contacted'].includes(job.stage) || ['submitted', 'sent'].includes(job.contact_status)) return 'sent';
    if (job.stage === 'ready') return 'live';
    return 'working';
  }
  const toneOf = job => {
    const cat = category(job);
    return cat === 'delivered' || (cat === 'manual' && manualSent(job)) ? 'sent' : cat;
  };
  function stageLabel(job) {
    if (job.stage === 'manual') return manualSent(job) ? 'Manual · sent' : 'Manual · to send';
    if (job.stage === 'queued') return requestedAt(job) ? 'Requested' : 'Target';
    return STAGE_LABELS[job.stage] || label(job.stage) || 'Queued';
  }
  function stepIndex(job) {
    const index = STEPS.findIndex(step => step.stages.includes(job.stage));
    if (index >= 0) return index;
    const facts = dataOf(job);
    if (['uncertain', 'attempting', 'blocked'].includes(job.contact_status)) return 6;
    if (safeUrl(job.preview_url)) return 5;
    if (facts.qa_passed === true) return 4;
    if (facts.workspace) return 2;
    return 1;
  }
  // Websites built by the generator, or meant for it, end with a delivered file instead of hosting and outreach.
  function fileFlow(job) {
    const facts = dataOf(job);
    return job.stage === 'delivered' || Boolean(facts.site_file || facts.jetai || requestedAt(job)) || /^generator-/.test(job.worker || '') || batchMode(batchById(job.batch_id)) === 'targets';
  }
  const stepsFor = job => (fileFlow(job) ? FILE_STEPS : STEPS);
  function stepStates(job) {
    const steps = stepsFor(job);
    const cat = category(job);
    const found = steps.findIndex(step => step.stages.includes(job.stage));
    const index = found >= 0 ? found : Math.min(stepIndex(job), steps.length - 1);
    const stopped = cat === 'attention' || cat === 'skipped';
    const finished = cat === 'sent' || (cat === 'manual' && manualSent(job));
    if (job.stage === 'delivered') return steps.map(() => 'done');
    if (job.stage === 'queued') return steps.map((step, i) => (i === 0 ? 'wait' : 'todo'));
    return steps.map((step, i) => (i < index ? 'done' : i > index ? 'todo' : finished ? 'done' : stopped ? 'stop' : 'now'));
  }

  // ---------------------------------------------------------------------------
  // State

  let data = null;
  let revision = null;
  let accessKey = storage.get('wg.key') || '';
  let locked = false;
  let pollTimer = null;
  let pollInFlight = false;
  let lastFullFetch = 0;
  let failures = 0;
  let pendingOpen = null; // a business added from the dashboard opens once the next sync brings it in
  const activity = {};
  const ui = {
    batch: 'all',
    filter: 'all',
    search: '',
    sort: storage.get('wg.sort') || 'recent',
    view: storage.get('wg.view') === 'table' ? 'table' : 'grid',
    job: null,
  };
  const narrow = window.matchMedia('(max-width: 760px)');

  const jobsById = () => new Map((data ? data.jobs : []).map(job => [job.id, job]));
  const batchById = id => (data ? data.batches.find(batch => batch.id === id) : null) || null;
  const scopeBatches = () => (data ? (ui.batch === 'all' ? data.batches : data.batches.filter(batch => batch.id === ui.batch)) : []);
  const scopeJobs = () => (data ? (ui.batch === 'all' ? data.jobs : data.jobs.filter(job => job.batch_id === ui.batch)) : []);
  const batchName = batch => (batch ? `${batch.industry} · ${batch.city}` : '');
  const runPrompt = batch => (batchMode(batch) === 'targets'
    ? `/local-business-revamp Find targets for the queued dashboard batch ${batch.id}: ${batch.requested_count} qualified ${batch.industry} businesses in ${batch.city}. Register them without building websites; I'll press Generate in the dashboard.`
    : `/local-business-revamp Run the queued dashboard batch ${batch.id}: ${batch.requested_count} completed websites for ${batch.industry} in ${batch.city}.`);

  const cloudRunner = () => Boolean(data && data.runner && data.runner.mode === 'github');

  /** The website generator (tools/site_runner.py) reports a heartbeat while it polls the ledger. */
  function generatorState() {
    const status = data && data.generator && typeof data.generator === 'object' ? data.generator : null;
    const seen = status ? Date.parse(status.seen_at) : NaN;
    if (cloudRunner()) {
      // GitHub Actions runs only while there is work, so "not connected" is normal between jobs.
      const dispatch = data.runner.dispatch && typeof data.runner.dispatch === 'object' ? data.runner.dispatch : null;
      const live = status && Number.isFinite(seen) && now() - seen <= 90000;
      const running = live && Array.isArray(status.running) ? status.running.length : 0;
      if (live && !status.ready) return { tone: 'manual', label: 'Needs setup', online: true, cloud: true, live, note: status.note || 'The GitHub job cannot build websites yet.' };
      if (live) return { tone: 'sent', label: running ? `Building ${plural(running, 'website')}` : 'Working on GitHub', online: true, ready: true, cloud: true, live, note: `A GitHub Actions job is running · builds up to ${status.max_parallel || 2} at a time.` };
      if (dispatch && dispatch.ok === false) return { tone: 'attention', label: "Can't start on GitHub", online: true, cloud: true, live, note: dispatch.error || 'GitHub did not start the job.' };
      return { tone: 'sent', label: 'On GitHub', online: true, ready: true, cloud: true, live, note: dispatch && dispatch.at ? `Starts by itself when there is work · last started ${ago(dispatch.at)}.` : 'Starts by itself when you press Generate or queue a batch.' };
    }
    if (!status || !Number.isFinite(seen)) return { tone: 'neutral', label: 'Not running', online: false, note: 'Nothing has connected yet. Start it on the computer that builds the websites.' };
    if (now() - seen > 90000) return { tone: 'neutral', label: 'Offline', online: false, note: `Last seen ${ago(status.seen_at)}${status.host ? ' on ' + status.host : ''}. Start it again to build requested websites.` };
    if (!status.ready) return { tone: 'manual', label: 'Needs setup', online: true, note: status.note || 'The generator cannot build websites yet.' };
    const running = Array.isArray(status.running) ? status.running.length : 0;
    return { tone: 'sent', label: running ? `Building ${plural(running, 'website')}` : 'Ready', online: true, ready: true, note: `Running on ${status.host || 'a computer'} · builds up to ${status.max_parallel || 2} at a time.` };
  }

  function matchesSearch(job) {
    if (!ui.search) return true;
    const haystack = [job.name, job.domain, job.url, job.detail, job.reason, job.worker].join(' ').toLowerCase();
    return ui.search.split(/\s+/).every(term => haystack.includes(term));
  }
  function sortJobs(list) {
    const updated = job => Date.parse(job.updated_at) || 0;
    const copy = list.slice();
    if (ui.sort === 'name') return copy.sort((a, b) => String(a.name).localeCompare(String(b.name)));
    if (ui.sort === 'oldest') return copy;
    if (ui.sort === 'stage') return copy.sort((a, b) => CATEGORY_ORDER.indexOf(category(a)) - CATEGORY_ORDER.indexOf(category(b)) || stepIndex(b) - stepIndex(a) || updated(b) - updated(a));
    return copy.sort((a, b) => updated(b) - updated(a));
  }

  // Replaces a region's markup only when it changed, keeping keyboard focus in place.
  function patch(element, html) {
    if (!element || element.__html === html) return;
    const active = document.activeElement;
    const key = active && element.contains(active) ? active.getAttribute('data-key') : null;
    element.innerHTML = html;
    element.__html = html;
    if (key) {
      const again = $$('[data-key]', element).find(item => item.getAttribute('data-key') === key);
      if (again) again.focus({ preventScroll: true });
    }
  }

  // ---------------------------------------------------------------------------
  // Pieces

  function hue(text) {
    let value = 7;
    for (const character of String(text || '')) value = (value * 31 + character.codePointAt(0)) % 360;
    return value;
  }
  function initials(name) {
    const words = String(name || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);
    const first = words[0] ? Array.from(words[0])[0] : '?';
    const second = words[1] ? Array.from(words[1])[0] : '';
    return (first + second).toUpperCase();
  }
  const avatar = (name, size) => `<span class="avatar${size ? ' avatar-' + size : ''}" style="--hue:${hue(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
  const chip = job => {
    const cat = category(job);
    return `<span class="chip${cat === 'working' && job.stage !== 'queued' ? ' is-moving' : ''}" data-tone="${cat === 'working' && job.stage === 'queued' ? 'neutral' : toneOf(job)}"><span class="chip-dot"></span>${esc(stageLabel(job))}</span>`;
  };
  const batchChip = batch => `<span class="chip chip-sm${batch.status === 'running' ? ' is-moving' : ''}" data-tone="${BATCH_TONES[batch.status] || 'neutral'}"><span class="chip-dot"></span>${esc(label(batch.status))}</span>`;
  function track(job) {
    const states = stepStates(job), steps = stepsFor(job);
    const at = states.findIndex(state => state === 'now' || state === 'stop' || state === 'wait');
    const description = at >= 0 ? `${states[at] === 'stop' ? 'Stopped at' : states[at] === 'wait' ? 'Waiting at' : 'At'} ${steps[at].label}, step ${at + 1} of ${steps.length}` : 'All steps done';
    const moving = category(job) === 'working' && job.stage !== 'queued';
    return `<div class="track${moving ? ' is-moving' : ''}" data-tone="${toneOf(job)}" role="img" aria-label="${esc(description)}">${states.map(state => `<i class="${state === 'todo' ? '' : state}"></i>`).join('')}</div>`;
  }

  // ---------------------------------------------------------------------------
  // Rendering

  function render() {
    if (!data) return;
    if (ui.batch !== 'all' && !batchById(ui.batch)) ui.batch = 'all';
    renderScope();
    renderNotice();
    renderGenerator();
    renderKpis();
    renderJobs();
    renderBatches();
    renderWorkers();
    renderActivity();
    renderControls();
    if ($('#drawer').open) renderDrawer();
  }

  function renderScope() {
    const batch = batchById(ui.batch);
    const jobs = scopeJobs();
    if (!batch) {
      patch($('#scope-title'), 'Overview');
      const active = data.batches.filter(item => ['queued', 'running'].includes(item.status)).length;
      $('#scope-sub').textContent = data.batches.length
        ? `${plural(data.batches.length, 'batch', 'batches')} · ${plural(jobs.length, 'business', 'businesses')}${active ? ` · ${active} active` : ''}`
        : 'Queue a batch to get started';
      patch($('#scope-actions'), '');
      return;
    }
    patch($('#scope-title'), `${esc(batch.industry)} ${batchChip(batch)}`);
    $('#scope-sub').textContent = isHandPicked(batch)
      ? `Businesses added from the dashboard · ${batch.completed_count} finished`
      : `${batch.city} · queued ${shortDate(batch.created_at)} · ${batch.completed_count} of ${batch.requested_count} finished${batchMode(batch) === 'targets' ? ' · targets list' : ''}`;
    const actions = [`<button type="button" class="btn btn-secondary btn-sm" data-add-website="${esc(batch.id)}" data-key="scope-add">${icon('globe')}Add website</button>`];
    if (['queued', 'running'].includes(batch.status) && !isHandPicked(batch) && !cloudRunner()) actions.push(`<button type="button" class="btn btn-secondary btn-sm" data-copy-prompt="${esc(batch.id)}" data-key="scope-prompt">${icon('terminal')}Copy run prompt</button>`);
    if (['queued', 'running', 'blocked'].includes(batch.status)) actions.push(`<button type="button" class="btn btn-ghost btn-sm" data-cancel-batch="${esc(batch.id)}" data-key="scope-cancel">Cancel batch</button>`);
    actions.push(`<button type="button" class="btn btn-ghost btn-sm" data-set-batch="all" data-key="scope-all">${icon('x')}All batches</button>`);
    patch($('#scope-actions'), actions.join(''));
  }

  function renderGenerator() {
    const state = generatorState();
    const requested = data.jobs.filter(job => job.stage === 'queued' && requestedAt(job)).length;
    $('#generator-note').textContent = requested ? `${requested} requested` : '';
    const command = `<div class="gen-cmd"><code>${esc(GENERATOR_COMMAND)}</code><button type="button" class="icon-btn icon-btn-sm" data-copy-value="${esc(GENERATOR_COMMAND)}" data-copy-label="Command" aria-label="Copy the command" title="Copy the command" data-key="gen-copy">${icon('copy')}</button></div>`;
    const actions = state.cloud && data.runner.repo && /^[\w.-]+\/[\w.-]+$/.test(data.runner.repo) ? safeUrl(`https://github.com/${data.runner.repo}/actions`) : null;
    patch($('#generator'), `<div class="gen-status" data-tone="${state.tone}"><span class="gen-dot" aria-hidden="true"></span><b>${esc(state.label)}</b></div>
      <p class="gen-note">${esc(state.note)}</p>
      ${state.online ? '' : `${command}<p class="gen-hint">Run it from the project folder on the computer where Claude Code is signed in, or double-click <b>Start Generator.bat</b>. Generate buttons queue up until it runs.</p>`}
      ${state.cloud ? `<p class="gen-hint">No computer needed: GitHub Actions finds targets and builds websites.${actions ? ` <a href="${esc(actions)}" target="_blank" rel="noopener noreferrer">See the runs on GitHub</a>.` : ''}</p>` : ''}
      ${state.online && !state.ready ? `<p class="gen-hint">Requests wait and start automatically once this is fixed.</p>` : ''}`);
    const notice = $('#generator-notice');
    if (state.cloud && requested && !state.live) {
      // Started on GitHub but not picked up yet (it usually takes under a minute), or GitHub refused.
      notice.hidden = false;
      notice.setAttribute('data-tone', state.ready ? 'working' : 'attention');
      patch(notice, `<span class="notice-icon">${icon('sparkle')}</span><div class="notice-body"><b>${plural(requested, 'website')} ${state.ready ? 'starting on GitHub' : 'waiting: GitHub did not start'}.</b><p>${esc(state.ready ? 'GitHub Actions usually picks new work up within a minute. If a start gets lost, it is sent again within 10 minutes.' : state.note + ' Requests wait until it is fixed.')}</p></div>`);
      return;
    }
    if (!requested || state.ready) {
      notice.hidden = true;
      patch(notice, '');
      return;
    }
    notice.hidden = false;
    notice.setAttribute('data-tone', state.online ? 'manual' : 'target');
    patch(notice, `<span class="notice-icon">${icon('sparkle')}</span><div class="notice-body"><b>${plural(requested, 'website')} waiting for the website generator.</b><p>${esc(state.online ? state.note : 'It is not running. Start it on your computer; requests are built in the order they were made.')}</p></div>${state.online ? '' : `<div class="notice-actions"><button type="button" class="pill" data-copy-value="${esc(GENERATOR_COMMAND)}" data-copy-label="Command" data-key="gen-notice-copy"><span>${esc(GENERATOR_COMMAND)}</span>${icon('copy')}</button></div>`}`);
  }

  function renderNotice() {
    const waiting = scopeBatches().filter(batch => batch.status === 'queued' && !isHandPicked(batch)).sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
    const notice = $('#notice');
    if (!waiting.length) {
      notice.hidden = true;
      patch(notice, '');
      return;
    }
    notice.hidden = false;
    notice.setAttribute('data-tone', 'working');
    if (cloudRunner()) {
      patch(notice, `<span class="notice-icon">${icon('clock')}</span><div class="notice-body"><b>${plural(waiting.length, 'batch', 'batches')} starting on GitHub.</b><p>GitHub Actions searches for targets, checks each website and builds the ones that qualify. Progress appears here as it happens.</p></div>`);
      return;
    }
    const chips = waiting.slice(0, 3).map(batch => `<button type="button" class="pill" data-copy-prompt="${esc(batch.id)}" data-key="notice-${esc(batch.id)}" title="Copy the Claude Code prompt for this batch"><span>${esc(batchName(batch))}</span>${icon('copy')}</button>`).join('');
    patch(notice, `<span class="notice-icon">${icon('clock')}</span><div class="notice-body"><b>${plural(waiting.length, 'batch', 'batches')} waiting for the coordinator.</b><p>Nothing runs until you start it in Claude Code. Copy a run prompt and paste it into Claude Code, opened in the project folder.</p></div><div class="notice-actions">${chips}</div>`);
  }

  function renderKpis() {
    const jobs = scopeJobs();
    const counts = {};
    jobs.forEach(job => { const cat = category(job); counts[cat] = (counts[cat] || 0) + 1; });
    // The hand-picked list has 100 nominal slots; it is not a target to reach.
    const targets = scopeBatches().filter(batch => batch.status !== 'cancelled' && !isHandPicked(batch));
    const target = sum(targets, batch => batch.requested_count);
    const done = sum(targets, batch => Math.min(batch.completed_count, batch.requested_count));
    const share = target ? Math.round((done / target) * 100) : 0;
    const requested = jobs.filter(job => job.stage === 'queued' && requestedAt(job)).length;
    const hosted = jobs.filter(job => safeUrl(job.preview_url)).length;
    const manualOpen = jobs.filter(job => job.stage === 'manual' && !manualSent(job)).length;
    const manualDone = jobs.filter(job => job.stage === 'manual' && manualSent(job)).length;
    const filesOnly = Boolean(counts.delivered) && !counts.sent;
    const tiles = [
      { key: filesOnly ? 'delivered' : 'sent', icon: filesOnly ? 'check' : 'send', label: filesOnly ? 'Websites delivered' : counts.delivered ? 'Finished' : 'Outreach sent', value: (counts.sent || 0) + (counts.delivered || 0), unit: ui.batch !== 'all' && target ? `/ ${target}` : '', sub: target ? `${share}% of the ${target}-site target` : 'No active target', progress: target ? Math.min(100, (done / target) * 100) : null },
      { key: 'target', icon: 'sparkle', label: 'Targets', value: counts.target || 0, sub: requested ? `${requested} waiting for the generator` : counts.target ? 'Press Generate on a business' : 'Add a website or find targets' },
      { key: 'working', icon: 'pulse', label: 'In progress', value: counts.working || 0, sub: counts.live ? `${counts.live} preview live` : hosted ? `${plural(hosted, 'site')} hosted so far` : 'Being built or checked' },
      { key: 'manual', icon: 'hand', label: 'Manual to send', value: manualOpen, sub: manualDone ? `${manualDone} marked sent` : 'Ready-to-copy messages' },
      { key: 'attention', icon: 'alert', label: 'Needs attention', value: counts.attention || 0, sub: `${counts.skipped || 0} skipped` },
    ];
    patch($('#kpis'), tiles.map(tile => `
      <button type="button" class="kpi" data-tone="${tile.key}" data-filter="${tile.key}" aria-pressed="${ui.filter === tile.key}" data-key="kpi-${tile.key}">
        <span class="kpi-label"><span class="kpi-icon">${icon(tile.icon)}</span>${esc(tile.label)}</span>
        <span class="kpi-value">${tile.value}${tile.unit ? `<small>${esc(tile.unit)}</small>` : ''}</span>
        ${tile.progress !== undefined && tile.progress !== null ? `<span class="progress" aria-hidden="true"><span style="width:${tile.progress.toFixed(1)}%"></span></span>` : ''}
        <span class="kpi-sub">${esc(tile.sub)}</span>
      </button>`).join(''));
  }

  function renderJobs() {
    const scoped = scopeJobs();
    const searched = scoped.filter(matchesSearch);
    const counts = { all: searched.length };
    searched.forEach(job => { const cat = category(job); counts[cat] = (counts[cat] || 0) + 1; });
    patch($('#filters'), CATEGORIES.map(item => `
      <button type="button" class="filter${ui.filter === item.key ? ' is-active' : ''}" data-filter="${item.key}" aria-pressed="${ui.filter === item.key}" data-key="filter-${item.key}"${item.key === 'all' ? '' : ` data-tone="${item.key}"`}>
        ${item.key === 'all' ? '' : '<span class="filter-dot"></span>'}${esc(item.label)}<span class="filter-count">${counts[item.key] || 0}</span>
      </button>`).join(''));
    const shown = sortJobs(searched.filter(job => ui.filter === 'all' || category(job) === ui.filter));
    $('#jobs-count').textContent = shown.length;

    let html;
    if (!data.batches.length) html = onboarding();
    else if (!scoped.length) {
      html = `<div class="empty"><span class="empty-icon">${icon('clock')}</span><h3>No businesses yet</h3><p>Businesses appear here as the coordinator discovers and qualifies them, or when you add one by its website address.</p><button type="button" class="btn btn-secondary btn-sm" data-add-website="${esc(ui.batch === 'all' ? '' : ui.batch)}" data-key="empty-add">${icon('globe')}Add website</button></div>`;
    } else if (!shown.length) {
      html = `<div class="empty"><span class="empty-icon">${icon('search')}</span><h3>No businesses match</h3><p>Nothing in this view matches your filter${ui.search ? ' and search' : ''}.</p><button type="button" class="btn btn-secondary btn-sm" data-clear-filters data-key="clear-filters">Clear filters</button></div>`;
    } else if (ui.view === 'table' && !narrow.matches) html = jobTable(shown);
    else html = `<div class="job-grid">${shown.map(jobCard).join('')}</div>`;
    patch($('#jobs'), html);
  }

  function onboarding() {
    return `<div class="empty empty-hero">
      <span class="brand-mark" aria-hidden="true">${icon('bolt', 'icon-fill')}</span>
      <h3>Start your first batch</h3>
      <p>Claude Code finds local businesses whose websites look dated; the website generator turns each one's real content into a fresh one-page website and uploads it to JetAI. Progress shows up here as it happens.</p>
      <ol class="how">
        <li><b>Find targets</b><span>Queue a batch and run it in Claude Code, or add a business by its website address.</span></li>
        <li><b>Press Generate</b><span>The website generator on your computer builds the website and uploads it as a JetAI draft.</span></li>
        <li><b>Follow along</b><span>Finished websites show up here with their file and JetAI prototype.</span></li>
      </ol>
      <div class="drawer-actions"><button type="button" class="btn btn-primary" data-new-batch data-key="onboarding-new">${icon('plus')}New batch</button><button type="button" class="btn btn-secondary" data-add-website="" data-key="onboarding-add">${icon('globe')}Add website</button></div>
    </div>`;
  }

  /** The right-hand side of a card or row: Generate for targets, otherwise the JetAI or preview link. */
  function jobAction(job, compact) {
    if (isTarget(job)) {
      if (requestedAt(job)) return `<span class="tag tag-wait" title="Requested ${esc(stamp(requestedAt(job)))}">${icon('clock')}Waiting for the generator</span>`;
      return compact
        ? `<button type="button" class="icon-btn icon-btn-sm" data-generate="${esc(job.id)}" aria-label="Generate the website of ${esc(job.name)}" title="Generate website" data-key="row-gen-${esc(job.id)}">${icon('sparkle')}</button>`
        : `<button type="button" class="btn btn-primary btn-sm btn-generate" data-generate="${esc(job.id)}" data-key="gen-${esc(job.id)}">${icon('sparkle')}Generate website</button>`;
    }
    const jet = jetaiOf(job);
    const link = safeUrl(jet.url) || safeUrl(jet.app_url);
    if (link) return `<a class="job-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">JetAI ${icon('external')}</a>`;
    if (jet.prototype_id) return `<span class="tag tag-jetai" title="JetAI prototype ${esc(jet.prototype_id)}">${icon('layers')}JetAI ${esc(jet.status || 'draft')}</span>`;
    if (jet.error) return `<span class="tag tag-error" title="${esc(jet.error)}">Upload failed</span>`;
    const preview = safeUrl(job.preview_url);
    if (preview) return compact
      ? `<a class="icon-btn icon-btn-sm" href="${esc(preview)}" target="_blank" rel="noopener noreferrer" aria-label="Open the preview of ${esc(job.name)}" title="Open preview">${icon('external')}</a>`
      : `<a class="job-link" href="${esc(preview)}" target="_blank" rel="noopener noreferrer">Preview ${icon('external')}</a>`;
    return '';
  }
  function jobSummary(job) {
    if (job.detail) return job.detail;
    if (isTarget(job)) return requestedAt(job) ? 'Waiting for the website generator.' : job.reason ? `Qualified: ${job.reason}` : 'Not built yet. Press Generate to build its website.';
    return job.reason || 'Waiting for the coordinator.';
  }

  function jobCard(job) {
    const route = dataOf(job).outreach_mode === 'manual' && job.stage !== 'manual' && category(job) === 'working' ? '<span class="tag tag-manual">Manual route</span>' : '';
    return `<article class="job-card">
      <div class="job-top">
        ${avatar(job.name)}
        <div class="job-titles">
          <h3><button type="button" class="job-open" data-open-job="${esc(job.id)}" data-key="job-${esc(job.id)}">${esc(job.name || 'Unnamed business')}</button></h3>
          <span class="job-domain">${esc(job.domain || hostOf(job.url) || 'Website pending')}</span>
        </div>
      </div>
      <div class="job-status">${chip(job)}${route}</div>
      ${track(job)}
      <p class="job-detail">${esc(jobSummary(job))}</p>
      <div class="job-foot">
        <span class="job-time" title="${esc(stamp(job.updated_at))}">${icon('clock')}${esc(ago(job.updated_at))}</span>
        ${jobAction(job, false)}
      </div>
    </article>`;
  }

  function jobTable(jobs) {
    const rows = jobs.map(job => {
      const batch = batchById(job.batch_id);
      return `<tr data-row-job="${esc(job.id)}">
        <td><div class="cell-biz">${avatar(job.name, 'sm')}<div><button type="button" class="job-open" data-open-job="${esc(job.id)}" data-key="row-${esc(job.id)}">${esc(job.name || 'Unnamed business')}</button><span class="job-domain">${esc(job.domain || hostOf(job.url))}</span></div></div></td>
        <td>${chip(job)}</td>
        <td>${track(job)}</td>
        <td class="cell-muted">${esc(batch ? (isHandPicked(batch) ? 'Hand-picked' : batch.city) : '')}</td>
        <td><span class="cell-detail">${esc(jobSummary(job))}</span></td>
        <td class="cell-muted" title="${esc(stamp(job.updated_at))}">${esc(ago(job.updated_at))}</td>
        <td>${jobAction(job, true)}</td>
      </tr>`;
    }).join('');
    return `<div class="table-wrap"><table class="job-table">
      <thead><tr><th scope="col">Business</th><th scope="col">Status</th><th scope="col">Progress</th><th scope="col">Location</th><th scope="col">Latest update</th><th scope="col">Updated</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  function renderBatches() {
    const batches = data.batches.slice().sort((a, b) => (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0));
    $('#batches-note').textContent = batches.length ? plural(batches.length, 'batch', 'batches') : '';
    if (!batches.length) {
      patch($('#batches'), `<p class="side-empty">No batches yet. <button type="button" class="link-btn" data-new-batch data-key="batches-new">Queue your first one</button>.</p>`);
      return;
    }
    const totalSent = sum(data.batches, batch => batch.completed_count);
    const rows = [`<button type="button" class="batch-row batch-all${ui.batch === 'all' ? ' is-active' : ''}" data-set-batch="all" aria-pressed="${ui.batch === 'all'}" data-key="batch-all"><span class="batch-name">All batches</span><span class="batch-stats"><b>${totalSent}</b> finished · ${data.jobs.length} businesses</span></button>`];
    batches.forEach(batch => {
      const share = batch.requested_count ? Math.min(100, (batch.completed_count / batch.requested_count) * 100) : 0;
      const extras = [batch.active_count ? `${batch.active_count} active` : '', batch.manual_count ? `${batch.manual_count} manual` : ''].filter(Boolean).join(' · ');
      rows.push(`<button type="button" class="batch-row${ui.batch === batch.id ? ' is-active' : ''}" data-set-batch="${esc(batch.id)}" aria-pressed="${ui.batch === batch.id}" data-key="batch-${esc(batch.id)}">
        <span class="batch-line"><span class="batch-name">${esc(batch.industry)}</span>${isHandPicked(batch) ? '' : batchChip(batch)}</span>
        <span class="batch-place">${esc(batch.city)} · ${esc(shortDate(batch.created_at))}${batchMode(batch) === 'targets' && !isHandPicked(batch) ? ' · targets' : ''}</span>
        ${isHandPicked(batch) ? '' : `<span class="progress" aria-hidden="true"><span style="width:${share.toFixed(1)}%"></span></span>`}
        <span class="batch-stats"><b>${batch.completed_count}</b>${isHandPicked(batch) ? '' : '/' + batch.requested_count} finished${extras ? ' · ' + esc(extras) : ''}</span>
      </button>`);
    });
    patch($('#batches'), rows.join(''));
  }

  function renderWorkers() {
    const max = Math.max(1, Number(data.settings && data.settings.max_workers) || 3);
    const running = data.workers.filter(worker => worker.status === 'running' && worker.job_id);
    const jobs = jobsById();
    const slots = Math.max(max, running.length);
    const items = [];
    for (let index = 0; index < slots; index++) {
      const worker = running[index];
      const slot = String(index + 1).padStart(2, '0');
      if (!worker) {
        items.push(`<li class="worker is-idle"><div class="worker-row"><span class="worker-slot">${slot}</span><span class="worker-main"><span class="worker-job">Available</span></span></div></li>`);
        continue;
      }
      const job = jobs.get(worker.job_id);
      const age = now() - Date.parse(worker.updated_at);
      const stale = Number.isFinite(age) && age > 120000;
      const minutes = Math.max(1, Math.floor(age / 60000));
      items.push(`<li class="worker is-busy${stale ? ' is-stale' : ''}">
        <button type="button" class="worker-row" data-open-job="${esc(worker.job_id)}" data-key="worker-${esc(worker.id)}">
          <span class="worker-slot">${slot}</span>
          <span class="worker-main"><span class="worker-job">${esc(job ? job.name : worker.job_id)}</span><span class="worker-meta">${esc(job ? stageLabel(job) : 'Working')} · ${esc(worker.id)}</span></span>
          <span class="worker-age" title="Last update ${esc(stamp(worker.updated_at))}">${esc(ago(worker.updated_at).replace(' ago', ''))}</span>
        </button>
        ${stale ? `<span class="worker-warn">${icon('alert')}No update for ${minutes}m — it may have stalled</span>` : ''}
      </li>`);
    }
    patch($('#workers'), items.join(''));
    $('#workers-note').textContent = `${running.length} of ${max} busy`;
    const queued = scopeJobs().filter(job => job.stage === 'queued');
    const asked = queued.filter(requestedAt).length;
    const foot = $('#workers-foot');
    foot.hidden = !queued.length;
    foot.textContent = queued.length ? `${plural(queued.length, 'target')} not built yet${asked ? ` · ${asked} requested` : ''}` : '';
  }

  function renderActivity() {
    const jobs = jobsById();
    const events = data.events
      .filter(event => ui.batch === 'all' || (event.job_id && jobs.get(event.job_id) && jobs.get(event.job_id).batch_id === ui.batch))
      .slice()
      .sort((a, b) => (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0) || b.id - a.id)
      .slice(0, 40);
    if (!events.length) {
      patch($('#activity'), '<li class="feed-empty">No activity yet.</li>');
      return;
    }
    patch($('#activity'), events.map(event => {
      const job = event.job_id ? jobs.get(event.job_id) : null;
      return `<li class="feed-item"${job ? ` data-tone="${toneOf(job)}"` : ''}>
        <span class="feed-dot" aria-hidden="true"></span>
        <div><p class="feed-msg">${esc(event.message)}</p>
        <span class="feed-meta">${job ? `<button type="button" class="link-btn" data-open-job="${esc(job.id)}" data-key="feed-${esc(event.id)}">${esc(job.name)}</button><span aria-hidden="true">·</span>` : ''}<time datetime="${esc(event.created_at)}" title="${esc(stamp(event.created_at))}">${esc(ago(event.created_at))}</time></span></div>
      </li>`;
    }).join(''));
  }

  function renderControls() {
    const select = $('#batch-select');
    const options = ['<option value="all">All batches</option>'].concat(data.batches.slice().reverse().map(batch => `<option value="${esc(batch.id)}">${esc(batchName(batch))}</option>`)).join('');
    if (select.__html !== options) {
      select.innerHTML = options;
      select.__html = options;
    }
    select.value = ui.batch;
    $('#sort-select').value = ui.sort;
    $$('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.getAttribute('data-view') === ui.view)));
    const sheet = $('#sheet-link');
    const sheetUrl = safeUrl(data.sheet_url);
    sheet.hidden = !sheetUrl;
    if (sheetUrl) sheet.href = sheetUrl;
    const viewer = data.viewer || {};
    $('#forget-key').hidden = viewer.method !== 'key';
    const real = data.batches.filter(batch => !isHandPicked(batch));
    const industries = Array.from(new Set(real.slice().reverse().map(batch => batch.industry).concat(['Electricians'])));
    const cities = Array.from(new Set(real.slice().reverse().map(batch => batch.city)));
    patch($('#industry-options'), industries.map(value => `<option value="${esc(value)}"></option>`).join(''));
    patch($('#city-options'), cities.map(value => `<option value="${esc(value)}"></option>`).join(''));
  }

  // ---------------------------------------------------------------------------
  // Business drawer

  function openJob(id) {
    if (!jobsById().has(id)) return;
    ui.job = id;
    const drawer = $('#drawer');
    $$('[data-part]', drawer).forEach(part => { part.__html = null; });
    renderDrawer();
    if (!drawer.open) drawer.showModal();
    $('.drawer-scroll', drawer).scrollTop = 0;
    loadActivity(id);
  }

  function renderDrawer() {
    const drawer = $('#drawer');
    const job = jobsById().get(ui.job);
    if (!job) {
      if (drawer.open) drawer.close();
      return;
    }
    const part = name => $(`[data-part="${name}"]`, drawer);
    const original = safeUrl(job.url), preview = safeUrl(job.preview_url);
    patch(part('head'), `${avatar(job.name, 'lg')}
      <div class="drawer-titles"><h2 id="drawer-title">${esc(job.name || 'Unnamed business')}</h2>${original ? `<a href="${esc(original)}" target="_blank" rel="noopener noreferrer">${esc(job.domain || hostOf(original))}</a>` : `<span class="job-domain">${esc(job.domain)}</span>`}</div>
      <button type="button" class="icon-btn" data-close-drawer aria-label="Close details" data-key="drawer-close">${icon('x')}</button>`);
    const states = stepStates(job);
    const jet = jetaiOf(job);
    const jetLink = safeUrl(jet.url) || safeUrl(jet.app_url);
    const actions = [];
    if (isTarget(job) && !requestedAt(job)) actions.push(`<button type="button" class="btn btn-primary btn-generate" data-generate="${esc(job.id)}" data-key="drawer-generate">${icon('sparkle')}Generate website</button>`);
    if (jetLink) actions.push(`<a class="btn btn-primary" href="${esc(jetLink)}" target="_blank" rel="noopener noreferrer">${icon('layers')}Open in JetAI</a>`);
    if (preview) actions.push(`<a class="btn btn-primary" href="${esc(preview)}" target="_blank" rel="noopener noreferrer">${icon('globe')}Open preview</a>`);
    if (original) actions.push(`<a class="btn btn-secondary" href="${esc(original)}" target="_blank" rel="noopener noreferrer">Original site ${icon('external')}</a>`);
    const waiting = isTarget(job) && requestedAt(job)
      ? `<div class="callout callout-target"><b>Waiting for the website generator.</b> ${esc(generatorState().ready ? 'It will start this website shortly.' : generatorState().note)}</div>` : '';
    patch(part('status'), `<div class="drawer-status">
      <div class="drawer-meta">${chip(job)}<span title="${esc(stamp(job.updated_at))}">Updated ${esc(ago(job.updated_at))}</span></div>
      ${actions.length ? `<div class="drawer-actions">${actions.join('')}</div>` : ''}${waiting}
      <ol class="steps" data-tone="${toneOf(job)}" aria-label="Pipeline progress">${stepsFor(job).map((step, index) => {
        const state = states[index];
        const name = index === 6 && job.stage === 'manual' ? 'Manual' : step.label;
        const marker = state === 'done' ? icon('check') : state === 'stop' ? icon('x') : '';
        const spoken = state === 'done' ? 'done' : state === 'now' ? 'in progress' : state === 'stop' ? 'stopped here' : state === 'wait' ? 'waiting for a worker' : 'not started';
        return `<li class="step is-${state}"><span class="step-dot" aria-hidden="true">${marker}</span><span class="step-label">${esc(name)}<span class="sr-only">, ${spoken}</span></span></li>`;
      }).join('')}</ol>
    </div>`);
    patch(part('manual'), manualPanel(job));
    patch(part('details'), detailsPanel(job));
    patch(part('evidence'), evidencePanel(job));
    renderDrawerActivity(job);
  }

  function contactRow(kind, value) {
    const isEmail = kind === 'email';
    const name = isEmail ? 'Email' : 'Phone';
    const text = typeof value === 'string' ? value.trim() : '';
    const valid = isEmail ? /^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(text) : /^\+?[0-9 ().-]{5,}$/.test(text);
    if (!text) return `<div class="contact"><span class="contact-icon">${icon(isEmail ? 'mail' : 'phone')}</span><span class="contact-text"><span class="contact-label">${name}</span><span class="contact-value is-missing">Not available</span></span></div>`;
    const href = isEmail ? `mailto:${text}` : `tel:${text.replace(/[^+0-9]/g, '')}`;
    return `<div class="contact"><span class="contact-icon">${icon(isEmail ? 'mail' : 'phone')}</span>
      <span class="contact-text"><span class="contact-label">${name}</span>${valid ? `<a class="contact-value" href="${esc(href)}" title="${esc(text)}">${esc(text)}</a>` : `<span class="contact-value" title="${esc(text)}">${esc(text)}</span>`}</span>
      <button type="button" class="icon-btn icon-btn-sm" data-copy-value="${esc(text)}" data-copy-label="${name}" aria-label="Copy ${name.toLowerCase()}" title="Copy ${name.toLowerCase()}" data-key="copy-${kind}">${icon('copy')}</button></div>`;
  }

  function manualPanel(job) {
    if (job.stage !== 'manual') {
      if (dataOf(job).outreach_mode === 'manual' && category(job) === 'working') {
        return `<section class="callout callout-manual"><h3>Manual outreach · website in progress</h3><p>This business can't be contacted through its own form. Once its preview is verified, the prepared message and contact details appear here.</p></section>`;
      }
      return '';
    }
    const info = manualInfo(job);
    const sent = Boolean(info.sent_at);
    const sources = (Array.isArray(info.source_urls) ? info.source_urls : []).map(safeUrl).filter(Boolean);
    return `<section class="manual${sent ? ' is-sent' : ''}" aria-labelledby="manual-title">
      <div class="manual-head"><span class="notice-icon">${icon(sent ? 'check' : 'hand')}</span><div>
        <h3 id="manual-title">${sent ? 'Marked as sent' : 'Send this proposal yourself'}</h3>
        <p>${sent ? `${esc(stamp(info.sent_at))}${info.sent_by ? ' by ' + esc(info.sent_by) : ''}. Undo if that was a mistake.` : 'The preview is live and verified, but this business has to be contacted by hand.'}</p>
      </div></div>
      ${info.reason ? `<p class="manual-reason"><b>Why manual:</b> ${esc(info.reason)}</p>` : ''}
      <div class="contact-grid">${contactRow('email', info.email)}${contactRow('phone', info.phone)}</div>
      ${sources.length ? `<p class="sources">Contact sources: ${sources.map(url => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(url))}${icon('external')}</a>`).join('')}</p>` : ''}
      <div class="field">
        <label class="field-label" for="manual-message">Prepared message</label>
        <textarea id="manual-message" class="message" readonly rows="9" spellcheck="false">${esc(info.message || '')}</textarea>
      </div>
      <div class="manual-actions">
        <button type="button" class="btn btn-secondary" data-copy-message data-key="copy-message"${info.message ? '' : ' disabled'}>${icon('copy')}Copy message</button>
        ${sent
          ? `<button type="button" class="btn btn-ghost" data-manual-sent="0" data-job="${esc(job.id)}" data-key="manual-toggle">Mark as not sent</button>`
          : `<button type="button" class="btn btn-primary" data-manual-sent="1" data-job="${esc(job.id)}" data-key="manual-toggle">${icon('check')}Mark as sent</button>`}
      </div>
      <p class="hint">Marking it sent only updates the ledger for your records. Nothing is sent from the dashboard.</p>
    </section>`;
  }

  function detailsPanel(job) {
    const batch = batchById(job.batch_id);
    const contactForm = safeUrl(dataOf(job).contact_url);
    const rows = [
      ['Latest update', esc(job.detail || '—')],
      job.reason ? ['Why it qualified', esc(job.reason)] : null,
      job.stage === 'delivered' ? ['Outreach', 'None — the website was handed over as a file'] : fileFlow(job) ? null : ['Outreach', esc(CONTACT_LABELS[job.contact_status] || label(job.contact_status) || 'Not sent yet')],
      jetaiOf(job).prototype_id ? ['JetAI prototype', `<span class="file-path"><span>${esc(jetaiOf(job).name || 'Website preview')} · ${esc(jetaiOf(job).status || 'draft')}</span><button type="button" class="icon-btn icon-btn-sm" data-copy-value="${esc(jetaiOf(job).prototype_id)}" data-copy-label="Prototype ID" aria-label="Copy the prototype ID" title="Copy the prototype ID ${esc(jetaiOf(job).prototype_id)}" data-key="copy-prototype">${icon('copy')}</button></span>`] : null,
      jetaiOf(job).error ? ['JetAI upload', `<span class="text-attention">${esc(jetaiOf(job).error)}</span>`] : null,
      requestedAt(job) ? ['Requested', esc(`${stamp(requestedAt(job))}${dataOf(job).generate_requested_by ? ' by ' + dataOf(job).generate_requested_by : ''}`)] : null,
      contactForm ? ['Contact form', `<a href="${esc(contactForm)}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(contactForm))}</a>`] : null,
      ['Batch', batch ? `<button type="button" class="link-btn" data-set-batch="${esc(batch.id)}" data-close-drawer data-key="details-batch">${esc(batchName(batch))}</button>` : esc(job.batch_id)],
      ['Worker', job.worker ? `<code>${esc(job.worker)}</code>` : 'Unassigned'],
      typeof dataOf(job).site_file === 'string' && safeUrl(dataOf(job).site_file) ? ['Website file', `<a href="${esc(safeUrl(dataOf(job).site_file))}" target="_blank" rel="noopener noreferrer">Open in Google Drive ${icon('external')}</a>`] : null,
      typeof dataOf(job).site_file === 'string' && dataOf(job).site_file && !safeUrl(dataOf(job).site_file) ? ['Website file', `<span class="file-path"><code>${esc(dataOf(job).site_file)}</code><button type="button" class="icon-btn icon-btn-sm" data-copy-value="${esc(dataOf(job).site_file)}" data-copy-label="File path" aria-label="Copy file path" title="Copy file path" data-key="copy-file">${icon('copy')}</button></span>`] : null,
      ['Last change', esc(stamp(job.updated_at))],
      job.data_error ? ['Ledger warning', esc(job.data_error)] : null,
    ].filter(Boolean);
    return `<section class="drawer-section"><h3>Details</h3><dl class="facts">${rows.map(row => `<div><dt>${row[0]}</dt><dd>${row[1]}</dd></div>`).join('')}</dl></section>`;
  }

  function evidencePanel(job) {
    const facts = dataOf(job);
    const qualification = facts.qualification && typeof facts.qualification === 'object' ? facts.qualification : {};
    const findings = Array.isArray(qualification.findings) ? qualification.findings.filter(item => typeof item === 'string' && item.trim()) : [];
    const sources = Array.isArray(facts.source_urls) ? facts.source_urls : [];
    const shots = Array.isArray(facts.screenshots) ? facts.screenshots : [];
    if (!findings.length && !sources.length && !shots.length) return '';
    const links = list => list.map(item => {
      const url = safeUrl(item);
      return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(shortUrl(url))}</a>` : `<code>${esc(item)}</code>`;
    }).join('');
    return `<section class="drawer-section"><h3>Qualification</h3>
      ${findings.length ? `<ul class="findings">${findings.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}
      ${typeof qualification.mobile_checked === 'boolean' ? `<p class="hint">${qualification.mobile_checked ? 'Mobile layout was checked.' : 'Mobile layout was not checked.'}</p>` : ''}
      ${sources.length ? `<div class="evidence"><span class="field-label">Sources</span><span class="evidence-items">${links(sources)}</span></div>` : ''}
      ${shots.length ? `<div class="evidence"><span class="field-label">Screenshots</span><span class="evidence-items">${links(shots)}</span></div>` : ''}
    </section>`;
  }

  function renderDrawerActivity(job) {
    const cached = activity[job.id];
    const events = cached ? cached.events : data.events.filter(event => event.job_id === job.id);
    patch($('[data-part="activity"]', $('#drawer')), events.length
      ? events.map(event => `<li><p>${esc(event.message)}</p><time datetime="${esc(event.created_at)}">${esc(stamp(event.created_at))} · ${esc(ago(event.created_at))}</time></li>`).join('')
      : '<li class="timeline-empty">No recorded activity yet.</li>');
  }

  function loadActivity(id) {
    const wanted = revision;
    if (activity[id] && activity[id].revision === wanted) return;
    server('getJobActivity', id, accessKey).then(events => {
      activity[id] = { revision: wanted, events: Array.isArray(events) ? events : [] };
      const job = jobsById().get(id);
      if (ui.job === id && job && $('#drawer').open) renderDrawerActivity(job);
    }).catch(() => { /* the snapshot's recent events stay visible */ });
  }

  // ---------------------------------------------------------------------------
  // Sync

  function setSync(state, text) {
    const sync = $('#sync');
    sync.setAttribute('data-state', state);
    $('.sync-label', sync).textContent = text;
    sync.title = state === 'live' ? `Live — last synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}` : text;
  }

  function schedule() {
    window.clearTimeout(pollTimer);
    if (locked) return;
    const delay = document.hidden ? 30000 : failures ? Math.min(30000, 4000 * Math.pow(2, failures - 1)) : 4000;
    pollTimer = window.setTimeout(poll, delay);
  }

  function poll(force) {
    if (pollInFlight || locked) return;
    pollInFlight = true;
    window.clearTimeout(pollTimer);
    const known = force === true || Date.now() - lastFullFetch > 60000 ? null : revision;
    server('getState', known, accessKey).then(result => {
      failures = 0;
      if (!result.unchanged) {
        applyState(result);
        lastFullFetch = Date.now();
      } else if (data && JSON.stringify([result.generator || null, result.runner || null]) !== JSON.stringify([data.generator || null, data.runner || null])) {
        data.generator = result.generator || null;
        data.runner = result.runner || data.runner || null;
        renderNotice();
        renderGenerator();
        if ($('#drawer').open) renderDrawer();
      }
      setSync('live', 'Live');
    }).catch(error => {
      if (isAccessError(error)) {
        showLock(error);
        return;
      }
      failures += 1;
      setSync(failures > 2 ? 'offline' : 'retrying', failures > 2 ? 'Offline' : 'Reconnecting…');
      if (!data) showLoadError(error);
    }).then(() => {
      pollInFlight = false;
      schedule();
    });
  }

  function applyState(next) {
    revision = next.revision;
    const serverTime = Date.parse(next.server_time);
    if (Number.isFinite(serverTime)) clockSkew = serverTime - Date.now();
    data = {
      batches: Array.isArray(next.batches) ? next.batches : [],
      jobs: Array.isArray(next.jobs) ? next.jobs : [],
      events: Array.isArray(next.events) ? next.events : [],
      workers: Array.isArray(next.workers) ? next.workers : [],
      settings: next.settings || {},
      generator: next.generator || null,
      runner: next.runner || null,
      viewer: next.viewer || {},
      sheet_url: next.sheet_url || '',
    };
    render();
    if (pendingOpen && jobsById().has(pendingOpen)) {
      const id = pendingOpen;
      pendingOpen = null;
      openJob(id);
    }
    if (ui.job && $('#drawer').open) loadActivity(ui.job);
  }

  function showLoadError(error) {
    const notice = $('#notice');
    notice.hidden = false;
    notice.setAttribute('data-tone', 'attention');
    patch(notice, `<span class="notice-icon">${icon('alert')}</span><div class="notice-body"><b>The ledger couldn't be loaded.</b><p>${esc(errorText(error))}</p></div><div class="notice-actions"><button type="button" class="btn btn-secondary btn-sm" data-retry data-key="retry">${icon('refresh')}Try again</button></div>`);
    $('#scope-sub').textContent = 'Not connected';
  }

  // ---------------------------------------------------------------------------
  // Access

  function showLock(error) {
    locked = true;
    window.clearTimeout(pollTimer);
    const message = errorText(error);
    const lock = $('#lock');
    const hadKey = Boolean(accessKey);
    if (hadKey) {
      accessKey = '';
      storage.set('wg.key', null);
    }
    $('#lock-error').textContent = hadKey && /not valid/i.test(message) ? 'The saved key no longer works. Enter the current dashboard key.' : '';
    lock.hidden = false;
    $('#app').setAttribute('aria-hidden', 'true');
    $('#app').inert = true;
    setSync('connecting', 'Locked');
    window.setTimeout(() => $('#lock-key').focus(), 0);
  }

  function hideLock() {
    locked = false;
    $('#lock').hidden = true;
    $('#app').removeAttribute('aria-hidden');
    $('#app').inert = false;
  }

  $('#lock-form').addEventListener('submit', event => {
    event.preventDefault();
    const input = $('#lock-key');
    const candidate = input.value.trim();
    const errorBox = $('#lock-error');
    if (!candidate) {
      errorBox.textContent = 'Enter the dashboard key.';
      input.focus();
      return;
    }
    const button = $('#lock-submit');
    button.disabled = true;
    button.textContent = 'Checking…';
    errorBox.textContent = '';
    server('getState', null, candidate).then(result => {
      accessKey = candidate;
      storage.set('wg.key', candidate);
      input.value = '';
      hideLock();
      failures = 0;
      applyState(result);
      lastFullFetch = Date.now();
      setSync('live', 'Live');
      schedule();
    }).catch(error => {
      errorBox.textContent = isAccessError(error) ? "That key didn't work. Check it and try again." : errorText(error);
      input.select();
    }).then(() => {
      button.disabled = false;
      button.textContent = 'Unlock';
    });
  });

  $('#forget-key').addEventListener('click', () => {
    accessKey = '';
    storage.set('wg.key', null);
    data = null;
    revision = null;
    showLock(new Error('ACCESS_DENIED: locked'));
    $('#lock-error').textContent = '';
  });

  // ---------------------------------------------------------------------------
  // Toasts

  function toast(message, tone) {
    const host = $('#toasts');
    const dialog = document.querySelector('dialog[open]');
    const parent = dialog || document.body;
    if (host.parentElement !== parent) parent.appendChild(host);
    const item = document.createElement('div');
    item.className = 'toast' + (tone === 'error' ? ' is-error' : '');
    item.setAttribute('role', tone === 'error' ? 'alert' : 'status');
    item.innerHTML = `${icon(tone === 'error' ? 'alert' : 'check')}<span>${esc(message)}</span>`;
    host.appendChild(item);
    window.setTimeout(() => {
      item.classList.add('is-leaving');
      window.setTimeout(() => item.remove(), 220);
    }, tone === 'error' ? 6000 : 3200);
  }

  function copyAndTell(text, what) {
    return copyText(text).then(copied => toast(copied ? `${what} copied` : `Couldn't copy automatically — select the text and copy it`, copied ? 'ok' : 'error'));
  }

  // ---------------------------------------------------------------------------
  // New batch

  const batchDialog = $('#batch-dialog');
  const batchForm = $('#batch-form');

  function syncMode() {
    const targets = batchForm.elements.mode.value === 'targets';
    $('#count-label').textContent = targets ? 'Targets to find' : 'Websites to finish';
    $('#count-hint').textContent = targets
      ? 'From 1 to 100 qualified businesses. Nothing is built until you press Generate on one.'
      : 'From 1 to 100. Only finished websites count — skipped businesses are replaced.';
  }

  function openBatchDialog() {
    batchForm.reset();
    batchForm.elements.requested_count.value = '5';
    syncMode();
    $$('[aria-invalid]', batchForm).forEach(field => field.removeAttribute('aria-invalid'));
    $('#batch-error').textContent = '';
    batchForm.hidden = false;
    $('#batch-done').hidden = true;
    syncPresets();
    if (!batchDialog.open) batchDialog.showModal();
    batchForm.elements.industry.focus();
  }

  function clampCount(value) {
    const number = Math.round(Number(value));
    return Number.isFinite(number) ? Math.min(100, Math.max(1, number)) : 5;
  }
  function syncPresets() {
    const value = String(batchForm.elements.requested_count.value);
    $$('[data-preset]', batchForm).forEach(button => button.setAttribute('aria-pressed', String(button.getAttribute('data-preset') === value)));
  }

  batchForm.addEventListener('click', event => {
    const step = event.target.closest('[data-step]');
    const preset = event.target.closest('[data-preset]');
    const field = batchForm.elements.requested_count;
    if (step) field.value = clampCount(Number(field.value || 0) + Number(step.getAttribute('data-step')));
    if (preset) field.value = preset.getAttribute('data-preset');
    if (step || preset) syncPresets();
  });
  batchForm.elements.requested_count.addEventListener('input', syncPresets);
  batchForm.addEventListener('change', event => { if (event.target.name === 'mode') syncMode(); });
  batchForm.elements.requested_count.addEventListener('blur', event => {
    if (event.target.value !== '') event.target.value = clampCount(event.target.value);
    syncPresets();
  });

  batchForm.addEventListener('submit', event => {
    event.preventDefault();
    const industry = batchForm.elements.industry.value.trim();
    const city = batchForm.elements.city.value.trim();
    const count = Number(batchForm.elements.requested_count.value);
    const mode = batchForm.elements.mode.value === 'targets' ? 'targets' : 'build';
    const problems = [];
    batchForm.elements.industry.setAttribute('aria-invalid', String(!industry));
    batchForm.elements.city.setAttribute('aria-invalid', String(!city));
    const countValid = Number.isInteger(count) && count >= 1 && count <= 100;
    batchForm.elements.requested_count.setAttribute('aria-invalid', String(!countValid));
    if (!industry) problems.push('an industry');
    if (!city) problems.push('a city or state');
    if (!countValid) problems.push('a website count from 1 to 100');
    if (problems.length) {
      $('#batch-error').textContent = `Add ${problems.join(', ').replace(/, ([^,]*)$/, ' and $1')}.`;
      (batchForm.querySelector('[aria-invalid="true"]') || batchForm.elements.industry).focus();
      return;
    }
    const submit = $('#batch-submit');
    submit.disabled = true;
    submit.textContent = 'Queuing…';
    $('#batch-error').textContent = '';
    server('queueBatch', { industry, city, requested_count: count, mode }, accessKey).then(result => {
      const batch = { id: result.id, industry, city, requested_count: result.requested_count, mode: result.mode || mode };
      $('#batch-done-summary').textContent = `${industry} · ${city} · ${batchMode(batch) === 'targets' ? plural(result.requested_count, 'target') + ' to find' : plural(result.requested_count, 'website')}`;
      $('#batch-prompt').textContent = runPrompt(batch);
      const onGitHub = Boolean(result.runner) || cloudRunner();
      $('#batch-next').hidden = onGitHub;
      $('#copy-prompt').hidden = onGitHub;
      $('#batch-cloud').hidden = !onGitHub;
      $('#batch-cloud').textContent = result.runner && result.runner.ok === false
        ? `Queued, but GitHub did not start: ${result.runner.error} It is retried automatically.`
        : 'Started on GitHub: it finds the targets and builds the websites. Progress appears on this dashboard as it happens; no computer needs to stay on.';
      batchForm.hidden = true;
      $('#batch-done').hidden = false;
      $('#copy-prompt').focus();
      ui.batch = 'all';
      poll(true);
    }).catch(error => {
      if (isAccessError(error)) {
        batchDialog.close();
        showLock(error);
        return;
      }
      $('#batch-error').textContent = `The batch couldn't be queued: ${errorText(error)}`;
    }).then(() => {
      submit.disabled = false;
      submit.textContent = 'Queue batch';
    });
  });

  $('#copy-prompt').addEventListener('click', () => copyAndTell($('#batch-prompt').textContent, 'Prompt'));
  [['#batch-form', '#batch-error'], ['#cancel-form', '#cancel-error'], ['#lock-form', '#lock-error']].forEach(([form, box]) => $(form).addEventListener('input', event => {
    $(box).textContent = '';
    if (event.target.hasAttribute('aria-invalid')) event.target.removeAttribute('aria-invalid');
  }));

  // ---------------------------------------------------------------------------
  // Add website and Generate

  const targetDialog = $('#target-dialog');
  const targetForm = $('#target-form');

  function syncTargetSubmit() {
    $('#target-submit').textContent = targetForm.elements.generate.checked ? 'Add and generate' : 'Add website';
  }

  function openTargetDialog(batchId) {
    targetForm.reset();
    $('#target-error').textContent = '';
    $$('[aria-invalid]', targetForm).forEach(field => field.removeAttribute('aria-invalid'));
    const lists = data ? data.batches.filter(batch => !isHandPicked(batch) && !['cancelled', 'complete', 'exhausted'].includes(batch.status)) : [];
    const select = $('#target-batch');
    select.innerHTML = '<option value="">Hand-picked websites</option>' + lists.slice().reverse().map(batch => `<option value="${esc(batch.id)}">${esc(batchName(batch))}${batch.available_count ? '' : ' (full)'}</option>`).join('');
    const scoped = batchById(batchId || '');
    select.value = scoped && !isHandPicked(scoped) && lists.includes(scoped) ? scoped.id : '';
    syncTargetSubmit();
    if (!targetDialog.open) targetDialog.showModal();
    targetForm.elements.name.focus();
  }

  targetForm.addEventListener('change', event => { if (event.target.name === 'generate') syncTargetSubmit(); });
  targetForm.addEventListener('input', event => {
    $('#target-error').textContent = '';
    if (event.target.hasAttribute('aria-invalid')) event.target.removeAttribute('aria-invalid');
  });
  targetForm.addEventListener('submit', event => {
    event.preventDefault();
    const name = targetForm.elements.name.value.trim();
    const url = targetForm.elements.url.value.trim();
    const generate = targetForm.elements.generate.checked;
    targetForm.elements.name.setAttribute('aria-invalid', String(!name));
    const urlValid = /^(https?:\/\/)?[^\s/]+\.[^\s/]+/i.test(url);
    targetForm.elements.url.setAttribute('aria-invalid', String(!urlValid));
    if (!name || !urlValid) {
      $('#target-error').textContent = !name ? 'Add the business name.' : 'Add the address of its current website, like brightsparkelectric.com.';
      (targetForm.querySelector('[aria-invalid="true"]') || targetForm.elements.name).focus();
      return;
    }
    const submit = $('#target-submit');
    submit.disabled = true;
    submit.textContent = 'Adding…';
    server('addTarget', { name, url, batch_id: targetForm.elements.batch_id.value, generate }, accessKey).then(result => {
      targetDialog.close();
      toast(generate ? `${name} added · the website generator will build it` : `${name} added to the list`);
      ui.filter = 'all';
      poll(true);
      pendingOpen = result.id;
    }).catch(error => {
      if (isAccessError(error)) {
        targetDialog.close();
        showLock(error);
        return;
      }
      const message = errorText(error);
      $('#target-error').textContent = /UNIQUE constraint/.test(message) ? 'That business is already in the ledger (same website, phone or email).' : message;
    }).then(() => {
      submit.disabled = false;
      syncTargetSubmit();
    });
  });

  function requestGenerate(button) {
    const id = button.getAttribute('data-generate');
    const job = jobsById().get(id);
    button.disabled = true;
    server('requestWebsite', id, accessKey).then(() => {
      const state = generatorState();
      toast(state.ready ? `Generating ${job ? job.name : 'the website'}…` : `Requested · ${state.online ? 'the generator needs setup first' : 'start the website generator to build it'}`, state.ready ? 'ok' : 'error');
      poll(true);
    }).catch(error => {
      button.disabled = false;
      if (isAccessError(error)) showLock(error);
      else toast(errorText(error), 'error');
    });
  }

  // ---------------------------------------------------------------------------
  // Cancel batch

  const cancelDialog = $('#cancel-dialog');
  const cancelForm = $('#cancel-form');
  let cancelTarget = null;

  function openCancelDialog(id) {
    const batch = batchById(id);
    if (!batch) return;
    cancelTarget = id;
    cancelForm.reset();
    $('#cancel-error').textContent = '';
    $('#cancel-batch-name').textContent = `${batchName(batch)} · ${batch.completed_count} of ${batch.requested_count} sent · ${plural(batch.active_count, 'business', 'businesses')} in progress`;
    cancelDialog.showModal();
    cancelForm.elements.reason.focus();
  }

  cancelForm.addEventListener('submit', event => {
    event.preventDefault();
    const reason = cancelForm.elements.reason.value.trim();
    if (!reason) {
      $('#cancel-error').textContent = 'Say why you are cancelling. It is saved with the batch history.';
      cancelForm.elements.reason.focus();
      return;
    }
    const submit = $('#cancel-submit');
    submit.disabled = true;
    submit.textContent = 'Cancelling…';
    server('cancelBatchFromDashboard', cancelTarget, reason, accessKey).then(result => {
      cancelDialog.close();
      toast(`Batch cancelled · ${plural(result.stopped_jobs, 'business', 'businesses')} stopped`);
      poll(true);
    }).catch(error => {
      if (isAccessError(error)) {
        cancelDialog.close();
        showLock(error);
        return;
      }
      $('#cancel-error').textContent = errorText(error);
    }).then(() => {
      submit.disabled = false;
      submit.textContent = 'Cancel batch';
    });
  });

  // ---------------------------------------------------------------------------
  // Events

  function setBatch(id) {
    ui.batch = id && batchById(id) ? id : 'all';
    render();
  }

  document.addEventListener('click', event => {
    const target = event.target;
    const close = target.closest('[data-close]');
    if (close) {
      const dialog = close.closest('dialog');
      if (dialog) dialog.close();
      return;
    }
    const opener = target.closest('[data-open-job]');
    if (opener) {
      openJob(opener.getAttribute('data-open-job'));
      return;
    }
    const batchButton = target.closest('[data-set-batch]');
    if (batchButton) {
      setBatch(batchButton.getAttribute('data-set-batch'));
      if (batchButton.hasAttribute('data-close-drawer')) $('#drawer').close();
      return;
    }
    if (target.closest('[data-close-drawer]')) {
      $('#drawer').close();
      return;
    }
    const filter = target.closest('[data-filter]');
    if (filter) {
      const key = filter.getAttribute('data-filter');
      ui.filter = filter.classList.contains('kpi') && ui.filter === key ? 'all' : key;
      render();
      const panel = $('.jobs-panel');
      if (filter.classList.contains('kpi') && panel.getBoundingClientRect().top > window.innerHeight * 0.6) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    const generate = target.closest('[data-generate]');
    if (generate) {
      requestGenerate(generate);
      return;
    }
    const addWebsite = target.closest('[data-add-website]');
    if (addWebsite) {
      if ($('#drawer').open) $('#drawer').close();
      openTargetDialog(addWebsite.getAttribute('data-add-website'));
      return;
    }
    const prompt = target.closest('[data-copy-prompt]');
    if (prompt) {
      const batch = batchById(prompt.getAttribute('data-copy-prompt'));
      if (batch) copyAndTell(runPrompt(batch), 'Run prompt');
      return;
    }
    const cancel = target.closest('[data-cancel-batch]');
    if (cancel) {
      openCancelDialog(cancel.getAttribute('data-cancel-batch'));
      return;
    }
    if (target.closest('[data-new-batch]')) {
      openBatchDialog();
      return;
    }
    if (target.closest('[data-clear-filters]')) {
      ui.filter = 'all';
      ui.search = '';
      $('#search').value = '';
      render();
      return;
    }
    if (target.closest('[data-retry]')) {
      $('#notice').hidden = true;
      setSync('connecting', 'Connecting…');
      poll(true);
      return;
    }
    const copyValue = target.closest('[data-copy-value]');
    if (copyValue) {
      copyAndTell(copyValue.getAttribute('data-copy-value'), copyValue.getAttribute('data-copy-label') || 'Text');
      return;
    }
    if (target.closest('[data-copy-message]')) {
      const area = $('#manual-message');
      copyText(area.value).then(copied => {
        if (copied) toast('Message copied');
        else {
          area.focus();
          area.select();
          toast('Message selected — use your copy shortcut', 'error');
        }
      });
      return;
    }
    const manual = target.closest('[data-manual-sent]');
    if (manual) {
      const sent = manual.getAttribute('data-manual-sent') === '1';
      manual.disabled = true;
      server('setManualSent', manual.getAttribute('data-job'), sent, accessKey).then(() => {
        toast(sent ? 'Marked as sent' : 'Sent mark removed');
        poll(true);
      }).catch(error => {
        manual.disabled = false;
        if (isAccessError(error)) showLock(error);
        else toast(errorText(error), 'error');
      });
      return;
    }
    const row = target.closest('[data-row-job]');
    if (row && !target.closest('a, button')) openJob(row.getAttribute('data-row-job'));
  });

  // Close a dialog when its backdrop is clicked.
  $$('dialog').forEach(dialog => dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const box = dialog.getBoundingClientRect();
    const inside = event.clientX >= box.left && event.clientX <= box.right && event.clientY >= box.top && event.clientY <= box.bottom;
    if (!inside || dialog.classList.contains('drawer')) dialog.close();
  }));
  $('#drawer').addEventListener('close', () => { ui.job = null; });
  $$('dialog').forEach(dialog => dialog.addEventListener('close', () => {
    const host = $('#toasts');
    if (host.parentElement === dialog) document.body.appendChild(host);
  }));

  $('#new-batch').addEventListener('click', openBatchDialog);
  $('#add-website').addEventListener('click', () => openTargetDialog(ui.batch === 'all' ? '' : ui.batch));
  $('#batch-select').addEventListener('change', event => setBatch(event.target.value));
  $('#sort-select').addEventListener('change', event => {
    ui.sort = event.target.value;
    storage.set('wg.sort', ui.sort);
    renderJobs();
  });
  $$('[data-view]').forEach(button => button.addEventListener('click', () => {
    ui.view = button.getAttribute('data-view');
    storage.set('wg.view', ui.view);
    renderControls();
    renderJobs();
  }));

  let searchTimer = null;
  $('#search').addEventListener('input', event => {
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(() => {
      ui.search = event.target.value.trim().toLowerCase();
      renderJobs();
    }, 120);
  });
  document.addEventListener('keydown', event => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (event.key === '/' && !typing && !locked && !document.querySelector('dialog[open]')) {
      event.preventDefault();
      $('#search').focus();
    }
    if (event.key === 'Escape' && document.activeElement === $('#search') && $('#search').value) {
      $('#search').value = '';
      ui.search = '';
      renderJobs();
    }
  });

  $('#theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    storage.set('wg.theme', next);
  });

  narrow.addEventListener('change', () => { if (data) renderJobs(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !locked) poll();
    else schedule();
  });
  // Relative times ("3m ago") and stalled-worker warnings advance without a server round trip.
  window.setInterval(() => { if (data && !document.hidden) render(); }, 30000);

  poll(true);
})();
</script>
