<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Website Generator</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="masthead"><div id="connection" class="connection"><i></i><span>Connecting</span></div></header>
<main>
<section class="intro"><h1>Website Generator<span class="title-dot">.</span></h1><div class="edition"><strong id="edition-count">00</strong><span>completed</span><span id="clock" class="sr-only"></span></div></section>
<section class="run-section" aria-labelledby="run-heading"><h2 id="run-heading" class="sr-only">New batch</h2><form id="batch-form"><label><span class="sr-only">Industry</span><input name="industry" placeholder="Industry" required maxlength="120" autocomplete="off"></label><label><span class="sr-only">City or state</span><input name="city" placeholder="City or state" required maxlength="120" autocomplete="off"></label><label><span class="sr-only">Completed website target</span><input name="requested_count" type="number" value="5" min="1" max="100" step="1" inputmode="numeric" required aria-label="Completed website target" placeholder="Websites"></label><button class="primary" type="submit">Queue batch <span aria-hidden="true">↗</span></button><label class="option"><input type="checkbox" name="targets_only"> Only find targets — I'll press Generate on the ones I want</label><p class="form-note">Enter a city or state. Target 1–100 finished websites (or targets to find). Skips do not count. Then run it in Claude Code.</p><p id="form-message" role="status" aria-live="polite"></p></form></section>
<section class="run-section" aria-labelledby="target-heading"><h2 id="target-heading" class="section-title">Add a website</h2><form id="target-form"><label><span class="sr-only">Business name</span><input name="name" placeholder="Business name" required maxlength="200" autocomplete="off"></label><label><span class="sr-only">Current website</span><input name="url" placeholder="Current website, e.g. brightspark.com" required maxlength="300" autocomplete="off" spellcheck="false"></label><button class="primary" type="submit">Add <span aria-hidden="true">↗</span></button><label class="option"><input type="checkbox" name="generate" checked> Generate the website now (the website generator reads the current site, writes a new one-page website and uploads it to JetAI as a draft)</label><p id="target-message" role="status" aria-live="polite"></p></form></section>
<section class="capacity" aria-labelledby="worker-heading"><div class="section-heading"><h2 id="worker-heading">Workers</h2><span id="capacity-note" class="subtle"></span></div><p id="generator-status" class="generator-status"></p><div id="workers" class="workers"></div></section>
<section class="sheet" aria-labelledby="sheet-heading"><div class="section-heading"><h2 id="sheet-heading">Businesses <span id="sheet-count" class="count">0</span></h2><select id="batch-filter" aria-label="Filter by batch"><option value="all">All batches</option></select></div><div class="sheet-toolbar"><div id="stage-filters" class="filters" role="group" aria-label="Filter by stage"><button data-filter="all" class="active" aria-pressed="true">All</button><button data-filter="target" aria-pressed="false">Targets</button><button data-filter="working" aria-pressed="false">Working</button><button data-filter="ready" aria-pressed="false">Live</button><button data-filter="manual" aria-pressed="false">Manual <span id="manual-count">0</span></button><button data-filter="contacted" aria-pressed="false">Sent</button><button data-filter="attention" aria-pressed="false">Attention</button></div></div><div id="queue-status" class="queue-status" hidden></div><div id="jobs" class="jobs"></div></section>
</main>
<dialog id="job-dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow">Details</span><button id="close-dialog" aria-label="Close details">✕</button></div><div id="dialog-content"></div></dialog>
</body></html>
